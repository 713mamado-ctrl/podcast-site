<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>بودكاست المصحح اللغوي</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f9f9f9;
    margin: 0;
    padding: 0;
  }

  h1 {
    text-align: center;
    color: #333;
    margin-top: 20px;
  }

  .container {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 40px;
    padding: 30px;
  }

  .sidebar {
    width: 200px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    margin-right: 10px; /* إبعادها عن الإطار */
  }

  .sidebar button {
    background: #fff;
    border: 2px solid #ccc;
    padding: 10px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
    transition: all 0.3s ease;
  }

  .sidebar button:hover {
    background: #4CAF50;
    color: white;
    border-color: #4CAF50;
  }

  .video-section {
    background: #fff;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    text-align: center;
    width: 700px;
  }

  video {
    width: 100%;
    border-radius: 10px;
    margin-bottom: 15px;
  }

  .controls {
    display: flex;
    justify-content: center;
    gap: 10px;
  }

  .controls button {
    background: #4CAF50;
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.3s;
  }

  .controls button:hover {
    background: #388E3C;
  }

</style>
</head>
<body>

<h1>مرحبًا بكم في بودكاست المصحح اللغوي</h1>

<div class="container">
  <div class="sidebar">
    <button id="introBtn">الافتتاح</button>
    <button id="ep1Btn">الحلقة الأولى</button>
    <button id="ep2Btn">الحلقة الثانية</button>
  </div>

  <div class="video-section">
    <video id="mainVideo" controls>
      <source src="assets/ma3kom_podcast_ma3na.mp4" type="video/mp4">
      متصفحك لا يدعم تشغيل الفيديو.
    </video>

    <div class="controls">
      <button id="playBtn">تشغيل</button>
      <button id="pauseBtn">إيقاف</button>
      <button id="rewindBtn">ترجيع</button>
    </div>
  </div>
</div>

<script>
  const video = document.getElementById('mainVideo');
  const playBtn = document.getElementById('playBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const rewindBtn = document.getElementById('rewindBtn');
  const introBtn = document.getElementById('introBtn');
  const ep1Btn = document.getElementById('ep1Btn');
  const ep2Btn = document.getElementById('ep2Btn');

  playBtn.addEventListener('click', () => video.play());
  pauseBtn.addEventListener('click', () => video.pause());
  rewindBtn.addEventListener('click', () => video.currentTime = Math.max(video.currentTime - 5, 0));

  introBtn.addEventListener('click', () => {
    video.src = "assets/ma3kom_podcast_ma3na.mp4";
    video.load();
    video.play();
  });

  ep1Btn.addEventListener('click', () => {
    video.src = "assets/episode1.mp4";
    video.load();
    video.play();
  });

  ep2Btn.addEventListener('click', () => {
    video.src = "assets/episode2.mp4";
    video.load();
    video.play();
  });
</script>

</body>
</html>
