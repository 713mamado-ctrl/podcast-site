<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>🎙️ بودكاست المصحح اللغوي</title>
<style>
  :root{
    --accent:#4CAF50;
    --accent-dark:#388E3C;
    --bg:#f8f8f8;
    --card:#ffffff;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:"Tajawal",Arial,sans-serif;
    background:var(--bg);
    color:#222;
    direction:rtl;
  }

  .container{
    max-width:1100px;
    margin:28px auto;
    padding:18px;
  }

  .layout{
    display:flex;
    gap:28px;
    align-items:flex-start;
  }

  /* الشريط الجانبي */
  .sidebar{
    width:190px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .side-btn{
    padding:10px;
    background:linear-gradient(135deg,#007bff,#005bb5);
    color:white;
    border-radius:10px;
    border:none;
    cursor:pointer;
    text-align:center;
    font-size:14px;
    transition:transform .14s ease, background .14s ease;
  }
  .side-btn:hover{
    background:linear-gradient(135deg,var(--accent),var(--accent-dark));
    transform:translateY(-2px);
  }

  .main{
    flex:1;
    display:flex;
    gap:20px;
    align-items:flex-start;
  }

  /* صورة محمد السخاوي على يسار الفيديو */
  .profile-large{
    width:200px;
    height:auto;
    border-radius:20px;
    box-shadow:0 6px 16px rgba(0,0,0,0.15);
    object-fit:cover;
  }

  .player-card{
    flex:1;
    background:var(--card);
    padding:18px;
    border-radius:14px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
  }

  .title{
    font-weight:700;
    color:var(--accent-dark);
    font-size:20px;
    margin-bottom:10px;
  }

  .video-wrap{
    position:relative;
    border-radius:12px;
    overflow:hidden;
    margin-bottom:14px;
  }
  video{
    width:100%;
    height:auto;
    display:block;
    background:#000;
    -webkit-user-drag:none;
    user-select:none;
  }
  .video-wrap .blocker{
    position:absolute;inset:0;z-index:5;
  }

  .controls{
    display:flex;
    gap:10px;
  }
  .controls button{
    padding:10px 14px;
    border-radius:10px;
    border:none;
    background:linear-gradient(135deg,var(--accent),var(--accent-dark));
    color:#fff;
    cursor:pointer;
    font-size:15px;
    transition:transform .12s ease;
  }
  .controls button:hover{transform:translateY(-3px);}
  .small-note{color:#666;font-size:13px;margin-top:10px;}
</style>
</head>
<body>
<div class="container">
  <div class="layout">
    <aside class="sidebar">
      <button class="side-btn" data-src="assets/ma3kom_podcast_opening.mp4">الافتتاح</button>
      <button class="side-btn" data-src="assets/ma3kom_podcast_ma3na.mp4">الحلقة الأولى</button>
      <button class="side-btn" data-src="assets/ma3kom_podcast_ep2.mp4">الحلقة الثانية</button>
    </aside>

    <div class="main">
      <img src="assets/profile.png" alt="محمد السخاوي" class="profile-large">

      <section class="player-card">
        <div class="title">مرحبًا بكم في بودكاست المصحح اللغوي</div>
        <div class="video-wrap">
          <video id="videoPlayer" playsinline preload="metadata" controlsList="nodownload nofullscreen noremoteplayback" disablePictureInPicture draggable="false">
            <source src="assets/ma3kom_podcast_opening.mp4" type="video/mp4">
            آسف، المتصفح لا يدعم تشغيل الفيديو.
          </video>
          <div class="blocker" oncontextmenu="return false"></div>
        </div>
        <div class="controls">
          <button id="playBtn">تشغيل ▶</button>
          <button id="pauseBtn">إيقاف ⏸</button>
          <button id="rewindBtn">⏪ ترجيع 10 ثوانٍ</button>
        </div>
        <div class="small-note">تم تعطيل التنزيل المباشر لحماية المحتوى.</div>
      </section>
    </div>
  </div>
</div>

<script>
  const video = document.getElementById('videoPlayer');
  document.getElementById('playBtn').onclick=()=>video.play();
  document.getElementById('pauseBtn').onclick=()=>video.pause();
  document.getElementById('rewindBtn').onclick=()=>video.currentTime=Math.max(0,video.currentTime-10);

  document.querySelectorAll('.side-btn').forEach(btn=>{
    btn.onclick=()=>{
      const src=btn.dataset.src;
      if(video.currentSrc.includes(src)){video.play();return;}
      while(video.firstChild)video.removeChild(video.firstChild);
      const s=document.createElement('source');
      s.src=src;s.type='video/mp4';
      video.appendChild(s);video.load();video.play();
    };
  });

  video.oncontextmenu=e=>e.preventDefault();
  window.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&['s','S','u','U'].includes(e.key)){e.preventDefault();}
  });
  video.ondragstart=e=>e.preventDefault();
</script>
</body>
</html>
