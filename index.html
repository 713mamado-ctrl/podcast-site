<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بودكاست المدقق اللغوي</title>
<style>
  body {
    font-family:"Cairo",sans-serif;
    background:#f9f9f9;
    margin:0;
    padding:0;
    text-align:center;
  }

  h1 {
    color:#007744;
    margin:25px 0;
    font-size:1.6em;
  }

  /* ✅ مربع الحلقة */
  .episode {
    background:#fff;
    margin:25px auto;
    padding:15px;
    border-radius:12px;
    width:45%;
    box-shadow:0 3px 10px rgba(0,0,0,0.08);
    display:none;
    transition:0.3s;
  }

  /* ✅ الفيديو */
  video {
    width:70%;
    border-radius:10px;
    margin-top:10px;
    border:3px solid #88cc99;
    box-shadow:0 0 8px rgba(0,128,0,0.1);
    opacity:0;
    transition:opacity 1s ease;
    display:none;
  }
  video.show { opacity:1; display:block; }

  /* ✅ الأزرار حول الفيديو */
  .btn-group {
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:10px;
  }

  button {
    flex:1;
    padding:8px 12px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
    font-size:0.9rem;
    transition:0.2s;
    color:#fff;
  }
  button:hover { transform:scale(1.05); opacity:0.9; }

  .play { background:#2196F3; }
  .pause { background:#f44336; }
  .forward { background:#4CAF50; }
  .rewind { background:#E91E63; }

  /* ✅ أزرار التنقل بين الحلقات */
  .nav-buttons {
    position:fixed;
    right:1.5cm;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    flex-direction:column;
    gap:10px;
    z-index:1000;
  }

  .nav-buttons button {
    background:#FF9800;
    padding:8px 14px;
    font-size:0.9rem;
    border-radius:8px;
  }

  .nav-buttons button:hover { background:#ffa726; }

  /* ✅ تصميم مخصص للموبايل */
  @media (max-width:768px){
    h1 { font-size:1.3em; }
    .episode { width:92%; margin:20px auto; padding:12px; }
    video { width:100%; }
    .btn-group { flex-direction:row; gap:6px; }
    button { font-size:0.8rem; padding:6px 8px; }

    /* أزرار التنقل تنتقل أسفل الصفحة */
    .nav-buttons {
      position:static;
      transform:none;
      flex-direction:row;
      justify-content:center;
      margin-bottom:15px;
    }
  }
</style>
</head>
<body>

<h1>🎙️ بودكاست المدقق اللغوي</h1>

<!-- أزرار التنقل -->
<div class="nav-buttons">
  <button id="prevBtn">⬆️ الحلقة السابقة</button>
  <button id="nextBtn">⬇️ الحلقة التالية</button>
</div>

<!-- الافتتاحية -->
<div id="ep-intro" class="episode" style="display:block;">
  <h2>الافتتاحية</h2>
  <div class="btn-group">
    <button class="play" onclick="playVideo('introVideo')">تشغيل</button>
    <button class="pause" onclick="pauseVideo('introVideo')">إيقاف</button>
  </div>
  <video id="introVideo" src="https://github.com/713mamado-ctrl/podcast-site/releases/download/v1-opening/ma3kom_podcast_ma3na.mp4"></video>
  <div class="btn-group">
    <button class="forward" onclick="forwardVideo('introVideo')">⏩ تقديم</button>
    <button class="rewind" onclick="rewindVideo('introVideo')">⏪ ترجيع</button>
  </div>
</div>

<!-- الحلقة الأولى -->
<div id="ep1" class="episode">
  <h2>الحلقة الأولى</h2>
  <div class="btn-group">
    <button class="play" onclick="playVideo('video1')">تشغيل</button>
    <button class="pause" onclick="pauseVideo('video1')">إيقاف</button>
  </div>
  <video id="video1" src="https://713mamado-ctrl.github.io/podcast-site/assets/الحلقة1.mp4"></video>
  <div class="btn-group">
    <button class="forward" onclick="forwardVideo('video1')">⏩ تقديم</button>
    <button class="rewind" onclick="rewindVideo('video1')">⏪ ترجيع</button>
  </div>
</div>

<script>
const episodes = ["ep-intro", "ep1"];
let currentIndex = 0;

/* ✅ عرض الحلقة المطلوبة */
function showEpisode(index) {
  episodes.forEach((id,i)=>{
    const ep = document.getElementById(id);
    const vid = ep.querySelector("video");
    vid.pause();
    vid.classList.remove("show");
    vid.style.display="none";
    ep.style.display = (i === index) ? "block" : "none";
  });
}

/* ✅ تشغيل الفيديو */
function playVideo(id){
  const v=document.getElementById(id);
  v.style.display="block";
  setTimeout(()=>v.classList.add("show"),10);
  v.play();
}

/* ✅ الإيقاف والتقديم والترجيع */
function pauseVideo(id){ document.getElementById(id).pause(); }
function forwardVideo(id){ const v=document.getElementById(id); v.currentTime+=5; }
function rewindVideo(id){ const v=document.getElementById(id); v.currentTime=Math.max(0, v.currentTime-5); }

/* ✅ زر الحلقة التالية */
document.getElementById("nextBtn").addEventListener("click",()=>{
  const currentVideo = document.querySelector(`#${episodes[currentIndex]} video`);
  currentVideo.pause();
  currentIndex = (currentIndex + 1) % episodes.length;
  showEpisode(currentIndex);
  window.scrollTo({top:0, behavior:"smooth"});
});

/* ✅ زر الحلقة السابقة */
document.getElementById("prevBtn").addEventListener("click",()=>{
  const currentVideo = document.querySelector(`#${episodes[currentIndex]} video`);
  currentVideo.pause();
  currentIndex = (currentIndex - 1 + episodes.length) % episodes.length;
  showEpisode(currentIndex);
  window.scrollTo({top:0, behavior:"smooth"});
});
</script>

</body>
</html>
