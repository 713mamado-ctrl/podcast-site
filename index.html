<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الحلقة الثانية</title>
  <style>
    /* حافظ على تصميم الموقع الحالي */
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .video-container {
      max-width: 800px;
      margin: auto;
    }

    video {
      width: 100%;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .controls {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .controls input[type="number"] {
      width: 70px;
      padding: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
      text-align: center;
    }

    .controls button, .next-button {
      padding: 10px 20px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .controls button:hover, .next-button:hover {
      background-color: #45a049;
    }

    .next-button {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <h1>الحلقة الثانية</h1>

  <div class="video-container">
    <video id="myVideo" controls>
      <source src="رابط_الفيديو_المباشر_من_GitHub" type="video/mp4">
      متصفحك لا يدعم عرض الفيديو.
    </video>

    <div class="controls">
      <label>بداية القص (ثانية):
        <input type="number" id="startTime" value="0" min="0">
      </label>

      <label>نهاية القص (ثانية):
        <input type="number" id="endTime" value="10" min="1">
      </label>

      <button onclick="playClip()">تشغيل الجزء</button>
      <button onclick="resetVideo()">إعادة الفيديو كامل</button>
    </div>

    <a href="رابط_ملف_الحلقة_الثالثة.html" class="next-button">الحلقة التالية</a>
  </div>

  <script>
    const video = document.getElementById('myVideo');

    function playClip() {
      const start = parseFloat(document.getElementById('startTime').value);
      const end = parseFloat(document.getElementById('endTime').value);

      if(start >= 0 && end > start) {
        video.currentTime = start;
        video.play();

        const checkTime = setInterval(() => {
          if(video.currentTime >= end) {
            video.pause();
            clearInterval(checkTime);
          }
        }, 200);
      } else {
        alert("تأكد أن الوقت صحيح (نهاية أكبر من البداية)");
      }
    }

    function resetVideo() {
      video.currentTime = 0;
      video.play();
    }
  </script>

</body>
</html>
