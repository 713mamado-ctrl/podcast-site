<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بودكاست المدقق اللغوي</title>
<style>
  body {
    margin: 0;
    font-family: "Cairo", sans-serif;
    background: #f9f9f9;
    color: #222;
    text-align: center;
    overflow-x: hidden;
  }

  h1 {
    margin: 30px 0 10px;
    color: #007744;
    text-align: left;
    margin-left: 10%;
  }

  .buttons {
    position: fixed;
    right: 3%;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 1000;
  }

  .buttons button {
    background: #007744;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1rem;
    transition: 0.3s;
  }

  .buttons button:hover {
    background: #00aa66;
  }

  .episode {
    background: white;
    margin: 40px auto;
    padding: 20px;
    border-radius: 12px;
    width: 40%;
    box-shadow: 0 0 20px rgba(0, 128, 0, 0.15);
    transition: 0.3s;
    position: relative;
  }

  .video-container {
    position: relative;
    display: inline-block;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
  }

  video {
    width: 100%;
    height: 100%;
    border-radius: 10px;
    display: none;
  }

  .play-button {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0, 119, 68, 0.9);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 70px;
    height: 70px;
    font-size: 1.5rem;
    cursor: pointer;
    transition: 0.3s;
    z-index: 10;
  }

  .play-button:hover {
    background: #00aa66;
    transform: translate(-50%, -50%) scale(1.1);
  }

  .control-buttons {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
    gap: 10px;
  }

  .control-buttons button {
    flex: 1;
    background: #007744;
    color: white;
    border: none;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
  }

  .control-buttons button:hover {
    background: #00aa66;
  }

  @media (max-width: 768px) {
    h1 { font-size: 1.3em; text-align: center; margin-left: 0; }
    .episode { width: 95%; margin: 20px auto; padding: 15px; }
    .control-buttons button { font-size: 0.9rem; padding: 8px; }
    .play-button { width: 60px; height: 60px; font-size: 1.3rem; }
  }
</style>
</head>
<body>

<h1>بودكاست المدقق اللغوي</h1>

<div class="buttons">
  <button onclick="scrollToEpisode('intro')">الافتتاحية</button>
  <button onclick="scrollToEpisode('ep1')">الحلقة الأولى</button>
</div>

<div id="intro" class="episode">
  <h2>الافتتاحية</h2>
  <div class="video-container">
    <video id="videoIntro" controls playsinline>
      <source src="https://github.com/713mamado-ctrl/podcast-site/releases/download/v1-opening/ma3kom_podcast_ma3na.mp4" type="video/mp4">
      متصفحك لا يدعم تشغيل الفيديو.
    </video>
    <button class="play-button" id="playBtnIntro" onclick="togglePlay('videoIntro','playBtnIntro')">▶</button>
  </div>

  <div class="control-buttons">
    <button onclick="rewindVideo('videoIntro')">⏪ ترجيع</button>
    <button onclick="pauseVideo('videoIntro')">⏸ إيقاف</button>
    <button onclick="playVideo('videoIntro')">▶ تشغيل</button>
    <button onclick="forwardVideo('videoIntro')">⏩ تقديم</button>
  </div>
</div>

<script>
const video = document.getElementById('videoIntro');
const playBtn = document.getElementById('playBtnIntro');

function togglePlay(videoId, btnId) {
  const v = document.getElementById(videoId);
  const b = document.getElementById(btnId);
  if (v.style.display === 'none') {
    v.style.display = 'block';
    b.style.display = 'none';
    v.play();
  } else if (v.paused) {
    v.play();
    b.style.display = 'none';
  } else {
    v.pause();
    b.style.display = 'block';
  }
}

function playVideo(id) {
  const v = document.getElementById(id);
  v.style.display = 'block';
  v.play();
  playBtn.style.display = 'none';
}

function pauseVideo(id) {
  const v = document.getElementById(id);
  v.pause();
  playBtn.style.display = 'block';
}

function rewindVideo(id) {
  const v = document.getElementById(id);
  v.currentTime = Math.max(0, v.currentTime - 5);
}

function forwardVideo(id) {
  const v = document.getElementById(id);
  v.currentTime = Math.min(v.duration, v.currentTime + 5);
}

function scrollToEpisode(id) {
  document.getElementById(id).scrollIntoView({ behavior: "smooth", block: "center" });
  pauseVideo('videoIntro');
}
</script>

</body>
</html>
