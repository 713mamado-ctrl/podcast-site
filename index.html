<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>🎙️ بودكاست المصحح اللغوي</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body {
    font-family: "Tajawal", Arial, sans-serif;
    background-color: #f8f8f8;
    text-align: center;
    padding: 30px;
    direction: rtl;
  }
  h1 { color: #333; margin-bottom: 10px; }
  p { color: #555; }
  .player-container {
    background: #fff;
    border-radius: 15px;
    padding: 20px;
    max-width: 700px;
    margin: 30px auto;
    box-shadow: 0 5px 10px rgba(0,0,0,0.1);
  }
  iframe { width: 100%; height: 400px; border-radius: 10px; margin-bottom: 15px; }
  .buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  button, a.download-btn {
    background-color: #007bff;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    text-decoration: none;
    transition: 0.3s;
  }
  button:hover, a.download-btn:hover { background-color: #0056b3; }
</style>
</head>
<body>

<h1>🎧 بودكاست المصحح اللغوي</h1>
<p>مرحبًا بكم! استمتعوا بأولى حلقاتنا 👇</p>

<div class="player-container">
  <iframe id="videoPlayer" src="https://www.youtube.com/embed/oxSD1S2nq8g" frameborder="0" allowfullscreen></iframe>

  <div class="buttons">
    <button onclick="document.getElementById('videoPlayer').src += '?autoplay=1'">تشغيل الآن ▶️</button>
    <a href="https://youtu.be/oxSD1S2nq8g" target="_blank" class="download-btn">مشاهدة على اليوتيوب ⬆️</a>
  </div>
</div>

</body>
</html>
