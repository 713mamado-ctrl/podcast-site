<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بودكاست الحلقة الأولى</title>
<style>
  body {
    margin:0;
    font-family: 'Cairo', sans-serif;
    background:#000;
    text-align:center;
  }
  video {
    width:70%;
    margin-top:30px;
    border-radius:15px;
    box-shadow:0 0 20px rgba(0,255,0,0.3);
  }
  #subtitles {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    background:rgba(255,255,255,0.85);
    padding:10px 20px;
    border-radius:10px;
    font-size:1.5em;
    color:#003366; /* أزرق داكن */
    max-width:80%;
    transition:opacity 1s ease-in-out;
    opacity:0;
  }
  #timer {
    margin-top:15px;
    font-size:1em;
    color:#0f0;
    opacity:0.8;
  }
</style>
</head>
<body>

<video id="podcastVideo" controls>
  <source src="الحلقة1.mp4" type="video/mp4">
  متصفحك لا يدعم عرض الفيديو.
</video>

<div id="subtitles"></div>
<div id="timer">00:00</div>

<script>
const video = document.getElementById('podcastVideo');
const subtitles = document.getElementById('subtitles');
const timer = document.getElementById('timer');

const script = [
  { start:0, end:10, text:"مرحبًا بكم في بودكاست المصحح اللغوي، حيث نغوص معًا في بحر العربية، فنكتشف أسرارها، ونستعيد جمالها الضائع." },
  { start:10, end:20, text:"يقولون: \"زلةُ لسانٍ قد تُفسِدُ ودًّا دامَ سنين\". لكن، أليس اللسان هو أداة البيان؟ فكيف يكون سببَ الهجر والخصام؟" },
  { start:20, end:30, text:"نعم، كلمة واحدة قد تهدم ما بُنِيَ بالعمر كله، لكن الكلمة نفسها قادرة على البناء، إذا خرجت من قلبٍ صادقٍ ولسانٍ فصيحٍ جميل." },
  { start:30, end:40, text:"في كل يومٍ، نقول مئات الكلمات، بعضها يجرح، وبعضها يُبهج، لكن أجملها تلك التي تُصلح، تُداوي، وتُعيد الإنسان إلى نفسه." },
  { start:40, end:50, text:"في هذه الحلقة، سنتحدث عن قوة الكلمة، وكيف يمكن لِمُدقّقٍ لغويٍّ أن يُعيد للحروفِ رونقَها، وللعباراتِ معناها الحقيقي." },
  { start:50, end:60, text:"تخيل أن أحدهم قال: \"لستُ راضيًا عنك.\" ثم عاد بعد لحظاتٍ وقال: \"كنتُ غاضبًا، وأنتَ عزيزٌ عليّ.\" كم تبدّلت المعاني بين الكلمتين!" },
  { start:60, end:70, text:"وهكذا تظل الكلمة مِفتاح القلوب، وجسر التفاهم بين الناس. احفظ لسانك، تُحفظ لك مكانتك." },
  { start:70, end:80, text:"لا تترك كلامك يضيع في الريح، اجعل منه نسمةَ لطفٍ تمرُّ على القلوب، فتُزهِر من جديد." },
  { start:80, end:90, text:"كنتم مع بودكاست المصحح اللغوي، أنا محمد السخاوي، نلتقي في الحلقة القادمة — بإذن الله — مع كلمة جديدة... وحكاية جديدة." }
];

video.addEventListener('timeupdate', () => {
  const current = video.currentTime;
  const minutes = String(Math.floor(current/60)).padStart(2,'0');
  const seconds = String(Math.floor(current%60)).padStart(2,'0');
  timer.textContent = `${minutes}:${seconds}`;

  const currentLine = script.find(line => current >= line.start && current < line.end);
  if(currentLine){
    if(subtitles.textContent !== currentLine.text){
      subtitles.style.opacity=0;
      setTimeout(()=>{
        subtitles.textContent=currentLine.text;
        subtitles.style.opacity=1;
      },300);
    }
  } else {
    subtitles.style.opacity=0;
  }
});
</script>

</body>
</html>
