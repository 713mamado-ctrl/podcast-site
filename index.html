<script>
const episodes = [
  { videoId:'video1', subsId:'subs1', timerId:'timer1', script:[
      {start:0,end:10,text:"مرحبًا بكم في بودكاست المصحح اللغوي، حيث نغوص معًا في بحر العربية..."},
      {start:10,end:20,text:"يقولون: زلةُ لسانٍ قد تُفسِدُ ودًّا دامَ سنين..."},
      {start:20,end:30,text:"نعم، كلمة واحدة قد تهدم ما بُنِيَ بالعمر كله..."}
  ]},
  { videoId:'video2', subsId:'subs2', timerId:'timer2', script:[
      {start:0,end:10,text:"مرحبًا في الحلقة الثانية، سنتحدث عن التشكيل وأهميته..."},
      {start:10,end:20,text:"مثال على الضم والفتح في الكلمات..."},
      {start:20,end:30,text:"كيف يُغيّر التشكيل معنى الكلمة..."}
  ]}
];

const videos = [];

episodes.forEach(ep=>{
  const video = document.getElementById(ep.videoId);
  const subs = document.getElementById(ep.subsId);
  const timer = document.getElementById(ep.timerId);
  videos.push(video);

  video.addEventListener('timeupdate',()=>{
    const current = video.currentTime;
    const minutes = String(Math.floor(current/60)).padStart(2,'0');
    const seconds = String(Math.floor(current%60)).padStart(2,'0');
    timer.textContent = `${minutes}:${seconds}`;

    const line = ep.script.find(s=>current>=s.start && current<s.end);
    if(line){
      if(subs.textContent!==line.text){
        subs.style.opacity=0;
        setTimeout(()=>{ subs.textContent=line.text; subs.style.opacity=1; },200);
      }
    } else { subs.style.opacity=0; }
  });
});

// التحكم في الأزرار + منع تشغيل أكثر من فيديو
document.querySelectorAll('.controls button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const video = document.getElementById(btn.dataset.video);

    // عند تشغيل أي فيديو، نوقف الباقيين
    if(btn.dataset.action==='play') {
      videos.forEach(v=>{
        if(v!==video && !v.paused) v.pause();
      });
      video.play();
    }
    else if(btn.dataset.action==='pause') video.pause();
    else if(btn.dataset.action==='rewind') video.currentTime = Math.max(video.currentTime-5,0);
  });
});
</script>
