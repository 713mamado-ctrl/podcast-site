<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>بودكاست المصحح اللغوي</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f9f9f9;
    margin: 0;
    padding: 0;
  }

  h1 {
    text-align: center;
    color: #333;
    margin-top: 25px;
  }

  .container {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 40px;
    padding: 30px;
  }

  /* الأزرار الجانبية العليا */
  .sidebar {
    width: 180px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    margin-right: 15px;
  }

  .sidebar button {
    background: #fff;
    border: 2px solid #ccc;
    padding: 5px 10px; /* ارتفاع أصغر */
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.3s ease;
  }

  .sidebar button:hover {
    background: #4CAF50;
    color: white;
    border-color: #4CAF50;
  }

  /* قسم الفيديو */
  .video-section {
    background: #fff;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    text-align: center;
    width: 700px;
  }

  video {
    width: 100%;
    border-radius: 10px;
    margin-bottom: 15px;
  }

  /* الأزرار السفلية تحت الفيديو */
  .controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 15px;
  }

  .controls button {
    background: #4CAF50; /* أخضر افتراضي */
    color: white;
    border: 2px solid #4CAF50;
    padding: 5px 10px; /* نفس ارتفاع الأزرار العلوية */
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s;
    font-size: 14px;
  }

  .controls button:hover {
    background: white; /* يتحول للأبيض عند المرور */
    color: #4CAF50;
  }
</style>
</head>
<body>

<h1>مرحبًا بكم في بودكاست المصحح اللغوي</h1>

<div class="container">
  <!-- الأزرار الجانبية العليا -->
  <div class="sidebar">
    <button id="introBtn">الافتتاح</button>
    <button id="ep1Btn">الحلقة الأولى</button>
    <button id="ep2Btn">الحلقة الثانية</button>
  </div>

  <!-- قسم الفيديو -->
  <div class="video-section">
    <video id="mainVideo">
      <source src="assets/ma3kom_podcast_ma3na.mp4" type="video/mp4">
      متصفحك لا يدعم تشغيل الفيديو.
    </video>

    <!-- الأزرار السفلية تحت الفيديو -->
    <div class="controls">
      <button id="playBtn">تشغيل</button>
      <button id="pauseBtn">إيقاف</button>
      <button id="rewindBtn">ترجيع</button>
    </div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const video = document.getElementById("mainVideo");
  const playBtn = document.getElementById("playBtn");
  const pauseBtn = document.getElementById("pauseBtn");
  const rewindBtn = document.getElementById("rewindBtn");
  const introBtn = document.getElementById("introBtn");
  const ep1Btn = document.getElementById("ep1Btn");
  const ep2Btn = document.getElementById("ep2Btn");

  // أزرار التحكم السفلية
  playBtn.onclick = () => { video.play(); };
  pauseBtn.onclick = () => { video.pause(); };
  rewindBtn.onclick = () => { video.currentTime = Math.max(video.currentTime - 5, 0); };

  // أزرار الحلقات
  introBtn.onclick = () => { video.src = "assets/ma3kom_podcast_ma3na.mp4"; video.load(); video.play(); };
  ep1Btn.onclick = () => { video.src = "assets/episode1.mp4"; video.load(); video.play(); };
  ep2Btn.onclick = () => { video.src = "assets/episode2.mp4"; video.load(); video.play(); };
});
</script>

</body>
</html>
