<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>بودكاست المصحح اللغوي</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body { font-family: Arial, sans-serif; padding: 20px; background: #f9f9f9; }
  h1 { color: #333; text-align: center; }
  .episode { background: #fff; padding: 15px; margin: 15px auto; border-radius: 10px; max-width: 700px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
  .ep-title { font-size: 20px; font-weight: bold; margin-bottom: 10px; }
  .ep-desc { margin-bottom: 10px; }
  video { width: 100%; border-radius: 8px; margin-top: 10px; display: none; }
  .btn-group { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  button, a.btn { flex: 1; padding: 8px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
  button:hover, a.btn:hover { transform: scale(1.05); opacity: 0.9; }
  .play-video { background: #2196F3; color: #fff; }
  .download-video { background: #4CAF50; color: #fff; text-decoration: none; text-align:center; }
  .play-now { background: #607D8B; color: #fff; }
  .youtube { background: #E91E63; color: #fff; text-decoration: none; text-align:center; }
</style>
</head>
<body>

<h1>بودكاست المصحح اللغوي</h1>
<p>مرحبًا بكم في صفحة البودكاست! إليكم الحلقة الأولى:</p>

<div class="episode">
  <div class="ep-title">الحلقة الأولى</div>
  <div class="ep-desc">ومعنا المصحح اللغوي</div>

  <!-- الأزرار الأربعة فوق الفيديو -->
  <div class="btn-group">
    <button id="playVideo" class="play-video">تشغيل الفيديو</button>
    <a href="assets/ma3kom_podcast_ma3na.mp4" download class="btn download-video">تحميل الفيديو</a>
  </div>

  <!-- مربع الفيديو -->
  <video id="podcastVideo" controls>
    <source src="assets/ma3kom_podcast_ma3na.mp4" type="video/mp4">
    متصفحك لا يدعم تشغيل الفيديو.
  </video>

  <!-- الأزرار السفلية -->
  <div class="btn-group" style="margin-top:10px;">
    <button id="playNow" class="play-now">تشغيل الآن</button>
    <a href="https://youtu.be/oxSD1S2nq8g" target="_blank" class="btn youtube">مشاهدة على اليوتيوب</a>
  </div>
</div>

<script>
window.addEventListener('DOMContentLoaded', function() {
  const video = document.getElementById('podcastVideo');

  document.getElementById('playVideo').addEventListener('click', function() {
    video.style.display = 'block';
    video.play();
  });

  document.getElementById('playNow').addEventListener('click', function() {
    video.style.display = 'block';
    video.play();
  });
});
</script>

</body>
</html>
