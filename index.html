<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بودكاست المدقق اللغوي - المعرض</title>
<style>
  body {
    margin: 0;
    font-family: 'Cairo', sans-serif;
    background: #f9f9f9;
    color: #222;
    text-align: center;
  }
  h1 {
    margin: 30px 0 10px;
    color: #007744;
  }
  .buttons {
    position: absolute;
    right: 10%;
    top: 150px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .buttons button {
    background: #007744;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1rem;
    transition: 0.3s;
  }
  .buttons button:hover {
    background: #00aa66;
  }
  .episode {
    background: white;
    margin: 40px auto;
    padding: 20px;
    border-radius: 12px;
    width: 55%; /* ← تم تقليص العرض ليصبح أنيقًا ومناسبًا */
    box-shadow: 0 0 20px rgba(0, 128, 0, 0.15);
    position: relative;
  }
  video {
    width: 100%;
    border-radius: 10px;
  }
  .controls {
    margin-top: 10px;
  }
  .controls button {
    padding: 6px 14px;
    margin: 0 5px;
    border: none;
    border-radius: 5px;
    background: #007744;
    color: #fff;
    cursor: pointer;
    transition: 0.3s;
  }
  .controls button:hover {
    background: #00aa66;
  }
  .timer {
    margin-top: 6px;
    color: #007744;
    font-size: 0.9em;
  }
</style>
</head>
<body>

<h1 style="text-align:left; margin-left:15%;">مرحبًا بكم في بودكاست المدقق اللغوي</h1>

<div class="buttons">
  <button onclick="scrollToEpisode('intro')">الافتتاحية</button>
  <button onclick="scrollToEpisode('ep1')">الحلقة الأولى</button>
</div>

<!-- الافتتاحية -->
<div id="intro" class="episode">
  <h2>الافتتاحية</h2>
  <video id="videoIntro" src="https://github.com/713mamado-ctrl/podcast-site/releases/download/v1-opening/ma3kom_podcast_ma3na.mp4" type="video/mp4"></video>
  <div class="controls">
    <button onclick="playVideo('videoIntro')">تشغيل</button>
    <button onclick="pauseVideo('videoIntro')">إيقاف</button>
    <button onclick="rewindVideo('videoIntro')">ترجيع 5 ثوانٍ</button>
  </div>
  <div class="timer" id="timerIntro">00:00</div>
</div>

<!-- الحلقة الأولى -->
<div id="ep1" class="episode">
  <h2>الحلقة الأولى</h2>
  <video id="video1" src="https://713mamado-ctrl.github.io/podcast-site/assets/الحلقة1.mp4" type="video/mp4"></video>
  <div class="controls">
    <button onclick="playVideo('video1')">تشغيل</button>
    <button onclick="pauseVideo('video1')">إيقاف</button>
    <button onclick="rewindVideo('video1')">ترجيع 5 ثوانٍ</button>
  </div>
  <div class="timer" id="timer1">00:00</div>
</div>

<script>
// تشغيل، إيقاف، وترجيع
function playVideo(id){ document.getElementById(id).play(); }
function pauseVideo(id){ document.getElementById(id).pause(); }
function rewindVideo(id){
  const v = document.getElementById(id);
  v.currentTime = Math.max(0, v.currentTime - 5);
}

// تحديث العداد
function setupTimer(videoId, timerId){
  const video = document.getElementById(videoId);
  const timer = document.getElementById(timerId);
  video.addEventListener('timeupdate', ()=>{
    const m = String(Math.floor(video.currentTime/60)).padStart(2,'0');
    const s = String(Math.floor(video.currentTime%60)).padStart(2,'0');
    timer.textContent = `${m}:${s}`;
  });
}

// التنقل بين الحلقات
function scrollToEpisode(id){
  document.getElementById(id).scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// تفعيل العداد
setupTimer('videoIntro','timerIntro');
setupTimer('video1','timer1');
</script>

</body>
</html>
