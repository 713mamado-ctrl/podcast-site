<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>بودكاست المصحح اللغوي</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f9f9f9;
    margin: 0;
    padding: 0;
    color: #333; /* لون النص الأساسي */
  }

  a, button {
    color: #333; /* نصوص واضحة */
    text-decoration: none;
  }

  /* الترحيب الملون */
  h1 {
    text-align: center;
    margin-top: 25px;
  }

  .container {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 40px;
    padding: 30px;
  }

  /* الأزرار الجانبية العليا */
  .sidebar {
    width: 180px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    margin-right: 15px;
  }

  .sidebar button {
    background: #fff;
    border: 2px solid #ccc;
    padding: 5px 10px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s ease;
    color: #333;
  }

  .sidebar button:hover {
    background: #4CAF50;
    color: white;
    border-color: #4CAF50;
  }

  .sidebar button:active {
    transform: scale(1.05);
  }

  /* قسم الفيديو */
  .video-section {
    background: #fff;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    text-align: center;
    width: 700px;
    position: relative;
  }

  video {
    width: 100%;
    border-radius: 10px;
    margin-bottom: 10px;
    opacity: 1;
    transition: opacity 0.5s ease;
  }

  /* عداد الوقت تحت الفيديو */
  .time-display {
    font-size: 16px;
    font-weight: bold;
    color: #333;
    margin-bottom: 10px;
  }

  /* الأزرار السفلية تحت الفيديو */
  .controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 15px;
  }

  .controls button {
    background: #4CAF50;
    color: white;
    border: 2px solid #4CAF50;
    padding: 5px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 14px;
  }

  .controls button:hover {
    background: white;
    color: #4CAF50;
  }

  .controls button:active {
    transform: scale(1.05);
  }
</style>
</head>
<body>

<h1>
  <span style="color:#e74c3c;">مرحبًا</span>
  <span style="color:#f1c40f;">بكم</span>
  <span style="color:#2ecc71;">في</span>
  <span style="color:#3498db;">بودكاست</span>
  <span style="color:#9b59b6;">المصحح</span>
  <span style="color:#e67e22;">اللغوي</span>
</h1>

<div class="container">
  <!-- الأزرار الجانبية العليا -->
  <div class="sidebar">
    <button id="introBtn">الافتتاح</button>
    <button id="ep1Btn">الحلقة الأولى</button>
    <button id="ep2Btn">الحلقة الثانية</button>
  </div>

  <!-- قسم الفيديو -->
  <div class="video-section">
    <video id="mainVideo">
      <source src="assets/ma3kom_podcast_ma3na.mp4" type="video/mp4">
      متصفحك لا يدعم تشغيل الفيديو.
    </video>

    <!-- عداد الوقت تحت الفيديو مباشرة -->
    <div class="time-display" id="timeDisplay">00:00 / 00:00</div>

    <!-- الأزرار السفلية تحت الفيديو -->
    <div class="controls">
      <button id="playBtn">تشغيل</button>
      <button id="pauseBtn">إيقاف</button>
      <button id="rewindBtn">ترجيع</button>
    </div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const video = document.getElementById("mainVideo");
  const playBtn = document.getElementById("playBtn");
  const pauseBtn = document.getElementById("pauseBtn");
  const rewindBtn = document.getElementById("rewindBtn");
  const introBtn = document.getElementById("introBtn");
  const ep1Btn = document.getElementById("ep1Btn");
  const ep2Btn = document.getElementById("ep2Btn");
  const timeDisplay = document.getElementById("timeDisplay");

  // دالة لتغيير الفيديو مع تأثير Fade
  function changeVideo(src) {
    video.style.opacity = 0;
    setTimeout(() => {
      video.src = src;
      video.load();
      video.play();
      video.style.opacity = 1;
    }, 300);
  }

  // أزرار التحكم السفلية
  playBtn.onclick = () => { video.play(); };
  pauseBtn.onclick = () => { video.pause(); };
  rewindBtn.onclick = () => { video.currentTime = Math.max(video.currentTime - 5, 0); };

  // أزرار الحلقات مع Fade
  introBtn.onclick = () => { changeVideo("assets/ma3kom_podcast_ma3na.mp4"); };
  ep1Btn.onclick = () => { changeVideo("assets/episode1.mp4"); };
  ep2Btn.onclick = () => { changeVideo("assets/episode2.mp4"); };

  // تحديث عداد الوقت
  video.addEventListener('timeupdate', () => {
    const formatTime = (t) => {
      const m = Math.floor(t / 60).toString().padStart(2,'0');
      const s = Math.floor(t % 60).toString().padStart(2,'0');
      return `${m}:${s}`;
    };
    timeDisplay.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration || 0)}`;
  });
});
</script>

</body>
</html>
