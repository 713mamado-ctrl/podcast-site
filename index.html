<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>🎙️ بودكاست المصحح اللغوي</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body {
    font-family: "Tajawal", Arial, sans-serif;
    background-color: #f8f8f8;
    text-align: center;
    padding: 30px;
    direction: rtl;
  }
  h1 {
    color: #333;
    margin-bottom: 10px;
  }
  p {
    color: #555;
  }
  .player-container {
    background: #fff;
    border-radius: 15px;
    padding: 20px;
    max-width: 700px;
    margin: 30px auto;
    box-shadow: 0 5px 10px rgba(0,0,0,0.1);
  }
  video {
    width: 100%;
    border-radius: 10px;
    margin-bottom: 15px;
  }
  .buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }
  button, a.download-btn {
    background-color: #007bff;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    text-decoration: none;
    transition: 0.3s;
  }
  button:hover, a.download-btn:hover {
    background-color: #0056b3;
  }
</style>
</head>
<body>

<h1>🎧 بودكاست المصحح اللغوي</h1>
<p>مرحبًا بكم! استمتعوا بأولى حلقاتنا الشيقة 👇</p>

<div class="player-container">
  <video id="videoPlayer" controls>
    <source src="assets/ma3kom_podcast_ma3na.mp4" type="video/mp4">
    متصفحك لا يدعم تشغيل الفيديو.
  </video>

  <div class="buttons">
    <button id="playVideo">تشغيل الفيديو 🎬</button>
    <button id="pauseVideo">إيقاف مؤقت ⏸️</button>
    <a href="assets/ma3kom_podcast_ma3na.mp4" download class="download-btn">تحميل الفيديو ⬇️</a>
    <a href="https://youtu.be/oxSD1S2nq8g" target="_blank" class="download-btn">مشاهدة على اليوتيوب ▶️</a>
  </div>
</div>

<script>
  const video = document.getElementById('videoPlayer');
  document.getElementById('playVideo').addEventListener('click', () => video.play());
  document.getElementById('pauseVideo').addEventListener('click', () => video.pause());
</script>

</body>
</html>
