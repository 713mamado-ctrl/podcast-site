<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بودكاست المصحح اللغوي - المعرض</title>
<style>
  body {
    margin:0;
    font-family: 'Cairo', sans-serif;
    background:#111; /* خلفية مظلمة */
    color:#fff;
    text-align:center;
  }
  h1 {
    margin-top:20px;
    color:#0f0;
  }
  .episode {
    background:#222;
    margin:20px auto;
    padding:15px;
    border-radius:10px;
    width:80%;
    box-shadow:0 0 15px rgba(0,255,0,0.3);
    position:relative;
  }
  video {
    width:100%;
    border-radius:10px;
  }
  .controls {
    margin-top:10px;
  }
  .controls button {
    padding:5px 12px;
    margin:0 5px;
    border:none;
    border-radius:5px;
    background:#0f0;
    color:#000;
    cursor:pointer;
    transition:0.3s;
  }
  .controls button:hover {
    background:#fff;
    color:#0f0;
  }
  .timer {
    margin-top:5px;
    color:#0f0;
    font-size:0.9em;
  }
  #subtitles {
    position:absolute;
    bottom:60px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(255,255,255,0.85);
    padding:10px 20px;
    border-radius:10px;
    font-size:1em;
    color:#003366;
    max-width:90%;
    transition:opacity 0.5s ease-in-out;
    opacity:0;
  }
</style>
</head>
<body>

<h1>مرحبًا بكم في بودكاست المصحح اللغوي</h1>

<!-- الحلقة الأولى -->
<div class="episode">
  <video id="video1" src="assets/الحلقة1.mp4" type="video/mp4"></video>
  <div id="subtitles1"></div>
  <div class="controls">
    <button onclick="playVideo('video1')">تشغيل</button>
    <button onclick="pauseVideo('video1')">إيقاف</button>
    <button onclick="rewindVideo('video1')">ترجيع 5 ثواني</button>
  </div>
  <div class="timer" id="timer1">00:00</div>
</div>

<!-- الحلقة الثانية -->
<div class="episode">
  <video id="video2" src="assets/الحلقة2.mp4" type="video/mp4"></video>
  <div id="subtitles2"></div>
  <div class="controls">
    <button onclick="playVideo('video2')">تشغيل</button>
    <button onclick="pauseVideo('video2')">إيقاف</button>
    <button onclick="rewindVideo('video2')">ترجيع 5 ثواني</button>
  </div>
  <div class="timer" id="timer2">00:00</div>
</div>

<script>
// الوظائف الأساسية لكل فيديو
function playVideo(id){
  document.getElementById(id).play();
}
function pauseVideo(id){
  document.getElementById(id).pause();
}
function rewindVideo(id){
  const v = document.getElementById(id);
  v.currentTime = Math.max(0, v.currentTime - 5);
}

// تحديث العداد لكل فيديو
function setupTimer(videoId, timerId){
  const video = document.getElementById(videoId);
  const timer = document.getElementById(timerId);
  video.addEventListener('timeupdate', ()=>{
    const m = String(Math.floor(video.currentTime/60)).padStart(2,'0');
    const s = String(Math.floor(video.currentTime%60)).padStart(2,'0');
    timer.textContent = `${m}:${s}`;
  });
}

setupTimer('video1','timer1');
setupTimer('video2','timer2');
</script>

</body>
</html>
