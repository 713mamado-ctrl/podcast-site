<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>بودكاست المصحح اللغوي</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f9f9f9;
    margin: 0;
    padding: 0;
  }

  /* الترحيب الملون */
  h1 {
    text-align: center;
    margin-top: 25px;
  }

  .container {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 40px;
    padding: 30px;
  }

  /* الأزرار الجانبية العليا */
  .sidebar {
    width: 180px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    margin-right: 15px;
  }

  .sidebar button {
    background: #fff;
    border: 2px solid #ccc;
    padding: 5px 10px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s ease;
  }

  .sidebar button:hover {
    background: #4CAF50;
    color: white;
    border-color: #4CAF50;
  }

  .sidebar button:active {
    transform: scale(1.05);
  }

  /* قسم الفيديو */
  .video-section {
    background: #fff;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    text-align: center;
    width: 700px;
    position: relative;
  }

  video {
    width: 100%;
    border-radius: 10px;
    margin-bottom: 10px;
    opacity: 1;
    transition: opacity 0.5s ease;
  }

  /* عداد الوقت تحت الفيديو */
  .time-display {
    font-size: 16px;
    font-weight: bold;
    color: #333;
    margin-bottom: 10px;
  }

  /* الأزرار السفلية تحت الفيديو */

    justify-content: center;
    gap: 10px;
    margin-bottom: 15px;
