<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>معرض حلقات بودكاست المصحح اللغوي</title>
<style>
  body {
    margin:0;
    font-family: 'Cairo', sans-serif;
    background:#000;
    color:#fff;
    text-align:center;
  }
  h2 {
    margin-top:20px;
    color:#0f0;
  }
  .episode {
    background:#111;
    margin:20px auto;
    padding:15px;
    border-radius:10px;
    max-width:800px;
    box-shadow:0 0 15px rgba(0,255,0,0.3);
    position:relative;
  }
  video {
    width:100%;
    border-radius:10px;
  }
  .controls {
    margin-top:10px;
  }
  .controls button {
    padding:5px 15px;
    margin:0 5px;
    border:none;
    border-radius:5px;
    background:#4CAF50;
    color:#fff;
    font-size:1em;
    cursor:pointer;
    transition:0.3s;
  }
  .controls button:hover { background:#fff; color:#4CAF50; }
  .timer {
    margin-top:5px;
    font-size:0.9em;
    color:#0f0;
    opacity:0.8;
  }
  #subtitles {
    position:absolute;
    bottom:50px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(255,255,255,0.85);
    color:#003366;
    padding:10px 15px;
    border-radius:8px;
    max-width:90%;
    font-size:1.2em;
    transition:opacity 0.5s;
    opacity:0;
  }
</style>
</head>
<body>

<h2>مرحبًا بكم في بودكاست المصحح اللغوي</h2>

<div class="episode">
  <video class="podcastVideo" controls>
    <source src="assets/الحلقة1.mp4" type="video/mp4">
    متصفحك لا يدعم عرض الفيديو.
  </video>
  <div class="controls">
    <button class="playBtn">تشغيل</button>
    <button class="pauseBtn">إيقاف</button>
    <button class="rewindBtn">ترجيع 5 ثواني</button>
  </div>
  <div class="timer">00:00</div>
  <div class="subtitles"></div>
</div>

<!-- مثال حلقة ثانية -->
<div class="episode">
  <video class="podcastVideo" controls>
    <source src="assets/الحلقة2.mp4" type="video/mp4">
    متصفحك لا يدعم عرض الفيديو.
  </video>
  <div class="controls">
    <button class="playBtn">تشغيل</button>
    <button class="pauseBtn">إيقاف</button>
    <button class="rewindBtn">ترجيع 5 ثواني</button>
  </div>
  <div class="timer">00:00</div>
  <div class="subtitles"></div>
</div>

<script>
// الكود يطبق على كل فيديو في المعرض
document.querySelectorAll('.episode').forEach(episode=>{
  const video = episode.querySelector('.podcastVideo');
  const playBtn = episode.querySelector('.playBtn');
  const pauseBtn = episode.querySelector('.pauseBtn');
  const rewindBtn = episode.querySelector('.rewindBtn');
  const timer = episode.querySelector('.timer');
  const subtitles = episode.querySelector('.subtitles');

  // مثال سكربت ترجمات لكل فيديو (يمكن تعديله لكل حلقة)
  const script = [
    { start:0, end:10, text:"مرحبًا بكم في بودكاست المصحح اللغوي" },
    { start:10, end:20, text:"هذا مثال على الترجمة المتزامنة مع الصوت" }
  ];

  playBtn.addEventListener('click', ()=>video.play());
  pauseBtn.addEventListener('click', ()=>video.pause());
  rewindBtn.addEventListener('click', ()=>video.currentTime = Math.max(0, video.currentTime-5));

  video.addEventListener('timeupdate', ()=>{
    const current = video.currentTime;
    const minutes = String(Math.floor(current/60)).padStart(2,'0');
    const seconds = String(Math.floor(current%60)).padStart(2,'0');
    timer.textContent = `${minutes}:${seconds}`;

    const currentLine = script.find(line => current >= line.start && current < line.end);
    if(currentLine){
      if(subtitles.textContent !== currentLine.text){
        subtitles.style.opacity=0;
        setTimeout(()=>{
          subtitles.textContent=currentLine.text;
          subtitles.style.opacity=1;
        },200);
      }
    } else {
      subtitles.style.opacity=0;
    }
  });
});
</script>

</body>
</html>
